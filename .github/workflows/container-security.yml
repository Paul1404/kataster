name: Container security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-security:
    name: Production image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kataster
          POSTGRES_DB: kataster_runtime_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kataster -d kataster_runtime_test"
          --health-interval 2s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://kataster@127.0.0.1:5432/kataster_runtime_test
      REDIS_URL: redis://127.0.0.1:6379
      LFIO_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: fixture-only-secret-for-isolated-runtime-tests
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --pull --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} --tag production-security:${{ github.sha }} .
      - name: Verify the pruned non-root runtime
        run: docker run --rm production-security:${{ github.sha }} bun scripts/check-runtime-packages.mjs
      - name: Exercise the real app and worker against isolated data services
        run: |
          docker run --rm --network host --env DATABASE_URL production-security:${{ github.sha }} bun run src/server/db/migrate.ts
          docker run --rm --network host --env DATABASE_URL --env REDIS_URL --env LFIO_ENCRYPTION_KEY --env BETTER_AUTH_SECRET --env BETTER_AUTH_URL production-security:${{ github.sha }} bun scripts/smoke-runtime-services.ts
          docker run --rm --network host --env DATABASE_URL --env REDIS_URL production-security:${{ github.sha }} bun scripts/smoke-host-inventory.ts
      - name: Scan OS and application packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: production-security:${{ github.sha }}
          scanners: vuln
          format: json
          output: image-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
      - name: Block fixable high and critical vulnerabilities
        run: python3 scripts/check-image-vulnerabilities.py image-vulnerabilities.json
      - name: Retain the complete vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-image-vulnerabilities
          path: image-vulnerabilities.json
          retention-days: 14
          if-no-files-found: error
